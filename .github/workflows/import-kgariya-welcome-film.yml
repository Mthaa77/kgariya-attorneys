name: Import Kgariya welcome film

on:
  push:
    branches:
      - feat/kgariya-combined-brand-film

permissions:
  contents: write

jobs:
  import-welcome-film:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kgariya-combined-brand-film
          fetch-depth: 0

      - name: Download the supplied film into the repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/videos
          if [ ! -s public/videos/kgariya-welcome-film.mp4 ]; then
            curl --fail --location --retry 3 \
              "https://hebbkx1anhila5yf.public.blob.vercel-storage.com/Creating_3D_law_firm_logo_89d6da7e-iz4wg6aMPps1Dj1VopFigp1K1E3d9a.mp4" \
              --output public/videos/kgariya-welcome-film.mp4
          fi
          test -s public/videos/kgariya-welcome-film.mp4
          file public/videos/kgariya-welcome-film.mp4

      - name: Commit the media asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/kgariya-welcome-film.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Assets: add Kgariya welcome film"
            git push origin HEAD:feat/kgariya-combined-brand-film
          fi
