name: Import Kgariya brand media

on:
  push:
    branches:
      - feat/kgariya-brand-film-integration

permissions:
  contents: write

jobs:
  import-brand-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kgariya-brand-film-integration
          fetch-depth: 0

      - name: Download the official emblem and welcome film
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images public/videos

          if [ ! -s public/images/kgariya-mark.webp ]; then
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/Mthaa77/kgariya-attorneys/feat/official-kgariya-logo/public/images/kgariya-mark.webp" \
              --output public/images/kgariya-mark.webp
          fi

          if [ ! -s public/videos/kgariya-welcome-film.mp4 ]; then
            curl --fail --location --retry 3 \
              "https://hebbkx1anhila5yf.public.blob.vercel-storage.com/Creating_3D_law_firm_logo_89d6da7e-iz4wg6aMPps1Dj1VopFigp1K1E3d9a.mp4" \
              --output public/videos/kgariya-welcome-film.mp4
          fi

          test -s public/images/kgariya-mark.webp
          test -s public/videos/kgariya-welcome-film.mp4
          file public/images/kgariya-mark.webp public/videos/kgariya-welcome-film.mp4
          sha256sum public/images/kgariya-mark.webp public/videos/kgariya-welcome-film.mp4

      - name: Commit media to the website repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/kgariya-mark.webp public/videos/kgariya-welcome-film.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Assets: add official Kgariya emblem and welcome film"
            git push origin HEAD:feat/kgariya-brand-film-integration
          fi
